<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Quản lý sinh viên</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      letter-spacing: 2px;
      color: #111827;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      margin-bottom: 28px;
    }

    .card h2 {
      margin-top: 0;
      font-size: 20px;
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .buttons {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }

    button {
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-secondary {
      background: #6b7280;
      color: white;
    }

    .btn-warning {
      background: #f59e0b;
      color: white;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .toolbar input {
      flex: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 12px;
      background: white;
    }

    th {
      background: #111827;
      color: white;
      padding: 14px;
      text-align: left;
    }

    td {
      padding: 13px 14px;
      border-bottom: 1px solid #e5e7eb;
    }

    tr:hover td {
      background: #f9fafb;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .empty {
      text-align: center;
      padding: 20px;
      color: #6b7280;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .toolbar {
        flex-direction: column;
      }

      table {
        font-size: 13px;
      }

      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>QUẢN LÝ SINH VIÊN</h1>

    <div class="card">
      <h2 id="formTitle">Thêm sinh viên</h2>

      <input id="id" placeholder="ID tự động" disabled style="margin-bottom: 14px;" />

      <div class="form-grid">
        <input id="name" placeholder="Nhập tên sinh viên" />
        <input id="email" placeholder="Nhập email" />
      </div>

      <div class="buttons">
        <button class="btn-primary" id="btnSubmit" onclick="submitForm()">Thêm sinh viên</button>
        <button class="btn-secondary" id="btnCancel" onclick="resetForm()" style="display:none;">Hủy</button>
      </div>
    </div>

    <div class="card">
      <h2>Danh sách sinh viên</h2>

      <div class="toolbar">
        <input id="search" placeholder="Tìm theo tên..." oninput="renderTable()" />
        <button class="btn-primary" onclick="loadStudents()">Tải lại</button>
      </div>

      <table>
        <thead>
          <tr>
            <th style="width: 80px;">ID</th>
            <th>Tên</th>
            <th>Email</th>
            <th style="width: 180px;">Hành động</th>
          </tr>
        </thead>
        <tbody id="studentTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API = "/api/students";
    let students = [];
    let editingId = null;

    async function loadStudents() {
      try {
        const res = await fetch(API);
        students = await res.json();
        renderTable();
      } catch (error) {
        console.error(error);
        alert("Không tải được danh sách sinh viên!");
      }
    }

    function renderTable() {
      const keyword = document.getElementById("search").value.toLowerCase().trim();
      const tbody = document.getElementById("studentTable");

      const filtered = students.filter(s =>
        (s.name || "").toLowerCase().includes(keyword)
      );

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="empty">Không có sinh viên nào</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(s => `
        <tr>
          <td>${s.id}</td>
          <td>${s.name || ""}</td>
          <td>${s.email || ""}</td>
          <td>
            <div class="actions">
              <button class="btn-warning" onclick="startEdit(${s.id})">Sửa</button>
              <button class="btn-danger" onclick="deleteStudent(${s.id})">Xóa</button>
            </div>
          </td>
        </tr>
      `).join("");
    }

    async function submitForm() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();

      if (!name) {
        alert("Bạn chưa nhập tên!");
        return;
      }

      if (!email) {
        alert("Bạn chưa nhập email!");
        return;
      }

      const student = { name, email };

      try {
        if (editingId === null) {
          await fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(student)
          });
        } else {
          await fetch(`${API}/update/${editingId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(student)
          });
        }

        resetForm();
        loadStudents();
      } catch (error) {
        console.error(error);
        alert("Lưu sinh viên thất bại!");
      }
    }

    function startEdit(id) {
      const student = students.find(s => s.id === id);
      if (!student) return;

      editingId = id;

      document.getElementById("id").value = student.id;
      document.getElementById("name").value = student.name || "";
      document.getElementById("email").value = student.email || "";

      document.getElementById("formTitle").textContent = "Sửa sinh viên";
      document.getElementById("btnSubmit").textContent = "Cập nhật";
      document.getElementById("btnCancel").style.display = "inline-block";
    }

    function resetForm() {
      editingId = null;

      document.getElementById("id").value = "";
      document.getElementById("name").value = "";
      document.getElementById("email").value = "";

      document.getElementById("formTitle").textContent = "Thêm sinh viên";
      document.getElementById("btnSubmit").textContent = "Thêm sinh viên";
      document.getElementById("btnCancel").style.display = "none";
    }

    async function deleteStudent(id) {
      if (!confirm("Bạn có chắc muốn xóa sinh viên ID " + id + "?")) return;

      try {
        await fetch(`${API}/delete/${id}`, {
          method: "POST"
        });

        loadStudents();
      } catch (error) {
        console.error(error);
        alert("Xóa sinh viên thất bại!");
      }
    }

    loadStudents();
  </script>
</body>
</html>
